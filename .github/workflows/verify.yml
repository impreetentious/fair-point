name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.x
          cache: npm
      - run: npm ci
      # Scoped to production dependencies: the shipped static export must stay
      # advisory-free, while dev-only tooling advisories do not block. This step
      # consults the live advisory database, so it can turn red without any commit
      # changing — that is intended, and the fix is a dependency bump, not a revert.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:version
      - run: npx playwright install --with-deps chromium
      - run: npm run check:citations
      - run: npm run verify
      - run: npm run build
      - run: npm run gates
