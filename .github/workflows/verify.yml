name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.x
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run build
      - run: npm run gates
