id: F-BRG-03
kind: bargain
description: Frontier extraction collapses duplicate utility pairs to the lowest index.
derivation: |
  Sorting by founder descending yields (4,1),(3,2),(2,3 index 1),(2,3 index 2),(1,4).
  The duplicate at index 2 does not strictly improve investor utility, so the frontier is 4,3,1,0.
input:
  points: [ { index: 0, uF: 1, uI: 4 }, { index: 1, uF: 2, uI: 3 }, { index: 2, uF: 2, uI: 3 }, { index: 3, uF: 3, uI: 2 }, { index: 4, uF: 4, uI: 1 } ]
  disagreement: { dF: 0, dI: 0 }
expect: { frontier: [4, 3, 1, 0] }
