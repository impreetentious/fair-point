id: F-BRG-TIE-01
kind: bargain
description: D23 affine-invariant Nash tie behavior.
derivation: |
  The points (1,4) and (2,2) tie at product 4, so index 10 wins. Scaling founder utility
  by a positive constant preserves the tie and the index key; the property test repeats it.
input:
  points: [{ index: 10, uF: 1, uI: 4 }, { index: 11, uF: 2, uI: 2 }]
  disagreement: { dF: 0, dI: 0 }
expect: { nash: 10 }
