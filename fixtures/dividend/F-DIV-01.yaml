id: F-DIV-01
kind: dividend
description: Cumulative preferred dividends add to the liquidation preference claim.
derivation: |
  Series A: invested $1,000,000, 1× non-participating, dividendKind=CUMULATIVE, rate=8%.
  yearsToExit=5 ⇒ accrued = 1e6 × ((1.08)^5 − 1) = 1e6 × 0.4693280768 = $469,328.0768.
  Preference claim = 1×invested + accrued = $1,469,328.0768 (§6.13).
  Cap table: 1,000,000 preferred + 9,000,000 common. At E = claim, preferred takes all;
  common receives $0. At E = claim + $900,000, preferred still takes preference only
  (NONE participation) and common receives the residual $900,000.
  Citation: Venture Deals (Feld & Mendelson, 4th ed.), ch. on liquidation preferences /
  dividends — cumulative dividends increase the preference stack; retrieved framing 2025-01-14.
input:
  capTable:
    classes:
      - { id: common, name: Common, kind: COMMON, shares: 9000000, holder: FOUNDER }
      - id: series-a
        name: Series A
        kind: PREFERRED
        shares: 1000000
        holder: INVESTOR
        invested: 1000000
        prefMultiple: 1
        participation: NONE
        dividendRate: 0.08
        dividendKind: CUMULATIVE
    grants: []
    poolAvailable: 0
  yearsToExit: 5
  exitValue: 2369328.0768
expect:
  accruedDividends: 469328.0768
  preferenceClaim: 1469328.0768
  payouts: { series-a: 1469328.0768, common: 900000 }
tolerance: 0.01
