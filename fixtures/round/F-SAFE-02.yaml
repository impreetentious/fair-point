id: F-SAFE-02
kind: safe
description: Pre-money SAFE chooses the cheaper discount conversion price.
derivation: |
  Cap price is 20M/10M=$2; discounted round price is 80%*$1=$0.80, so shares are
  $1M/$0.80=1.25M.
input:
  baseCap: 10000000
  roundPps: 1
  safes:
    - {
        id: pre,
        name: Pre-money,
        amount: 1000000,
        kind: PRE_MONEY,
        valuationCap: 20000000,
        discount: 0.2,
      }
expect:
  sharesBySafe: { pre: 1250000 }
tolerance: 0.01
