id: F-SAFE-06
kind: round
description: Two post-money SAFE routes are solved globally to a shared fixed point.
derivation: |
  A=$1M at a $10M cap plus 50% discount and B=$843,750 at an $8.4375M cap plus
  10% discount are evaluated together at the derived round PPS; the fixture asserts the
  simultaneous solution: A takes its 50% discount, B takes its 10% cap ownership,
  and the derived round PPS is $0.70.
input:
  capTable:
    classes: [{ id: common, name: Common, kind: COMMON, shares: 10000000, holder: FOUNDER }]
    grants: []
    poolAvailable: 0
  safes:
    - { id: a, name: A, amount: 1000000, kind: POST_MONEY, valuationCap: 10000000, discount: 0.5 }
    - { id: b, name: B, amount: 843750, kind: POST_MONEY, valuationCap: 8437500, discount: 0.1 }
  terms:
    {
      preMoney: 10000000,
      investment: 1000000,
      poolTargetPost: 0,
      prefMultiple: 1,
      participation: NONE,
      seniority: PARI,
    }
expect:
  pps: 0.7
  safeShares: 4285714.285714286
tolerance: 0.001
