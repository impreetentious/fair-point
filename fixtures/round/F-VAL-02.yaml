id: F-VAL-02
kind: validation
description: Preferred class requires invested capital.
derivation: |
  A preferred class without invested cannot have a defined preference or cap basis.
input:
  schemaVersion: '1.0.0'
  name: Missing invested
  pre:
    classes:
      - { id: common, name: Common, kind: COMMON, shares: 10, holder: FOUNDER }
      - {
          id: preferred,
          name: Preferred,
          kind: PREFERRED,
          shares: 1,
          holder: INVESTOR,
          prefMultiple: 1,
          participation: NONE,
        }
    grants: []
    poolAvailable: 0
  safes: []
  terms:
    {
      preMoney: 100,
      investment: 10,
      poolTargetPost: 0.1,
      prefMultiple: 1,
      participation: NONE,
      seniority: PARI,
    }
  founderBeliefs: { p0: 0.2, p50: 100, p90: 200 }
  investorBeliefs: { p0: 0.2, p50: 100, p90: 200 }
  sharedBeliefs: true
  disagreement: { dF: 0, dI: 0 }
  space:
    {
      preMoneyRange: [50, 150],
      preMoneySteps: 9,
      pinnedInvestment: 10,
      pools: [0.1],
      multiples: [1],
      participations: [NONE],
      seniority: PARI,
    }
expect: { valid: false }
