id: F-VAL-04
kind: validation
description: Original issue price must agree with invested divided by shares.
derivation: |
  Invested/shares is $2.00, not the supplied $3.00; V11 rejects the 50% mismatch.
input:
  schemaVersion: '1.0.0'
  name: Bad OIP
  pre:
    classes:
      - { id: common, name: Common, kind: COMMON, shares: 10, holder: FOUNDER }
      - { id: preferred, name: Preferred, kind: PREFERRED, shares: 1000000, holder: INVESTOR, invested: 2000000, originalIssuePrice: 3, prefMultiple: 1, participation: NONE }
    grants: []
    poolAvailable: 0
  safes: []
  terms: { preMoney: 10000000, investment: 1000000, poolTargetPost: 0.1, prefMultiple: 1, participation: NONE, seniority: PARI }
  founderBeliefs: { p0: 0.2, p50: 100, p90: 200 }
  investorBeliefs: { p0: 0.2, p50: 100, p90: 200 }
  sharedBeliefs: true
  disagreement: { dF: 0, dI: 0 }
  space: { preMoneyRange: [5000000, 15000000], preMoneySteps: 9, pinnedInvestment: 1000000, pools: [0.1], multiples: [1], participations: [NONE], seniority: PARI }
expect: { valid: false, message: 'V11: OIP inconsistent' }
