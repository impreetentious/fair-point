id: F-WF-11
kind: waterfall
description: In-the-money cash-exercise grant receives its net payoff.
derivation: |
  The option adds $10 strike cash, so Edist=$110 over two shares. PPS=$55 and the
  grant's reported net payout is $55-$10=$45.
input:
  capTable:
    classes: [ { id: common, name: Common, kind: COMMON, shares: 1, holder: FOUNDER } ]
    grants: [ { id: g, options: 1, strike: 10, holder: OTHER } ]
    poolAvailable: 0
  exitValue: 100
expect:
  payouts: { common: 55, g: 45 }
  strikeCashPaid: 10
tolerance: 0.01
