id: F-WF-14
kind: waterfall
description: Unissued option pool counts nowhere in exit proceeds.
derivation: |
  The 100 unissued pool shares get no exit distribution; the single issued common share gets E.
input:
  capTable:
    classes: [{ id: common, name: Common, kind: COMMON, shares: 1, holder: FOUNDER }]
    grants: []
    poolAvailable: 100
  exitValue: 100
expect:
  payouts: { common: 100 }
tolerance: 0.01
