id: F-WF-17
kind: waterfall
description: Capped participant remains fixed after its cap binds.
derivation: |
  At E=$25M, the 3x cap fixes A at $6M, leaving $19M for common.
input:
  capTable:
    classes:
      - { id: common, name: Common, kind: COMMON, shares: 8000000, holder: FOUNDER }
      - {
          id: a,
          name: A,
          kind: PREFERRED,
          shares: 2000000,
          holder: INVESTOR,
          invested: 2000000,
          prefMultiple: 1,
          participation: CAPPED,
          participationCapMultiple: 3,
        }
    grants: []
    poolAvailable: 0
  exitValue: 25000000
expect:
  payouts: { common: 19000000, a: 6000000 }
tolerance: 0.01
